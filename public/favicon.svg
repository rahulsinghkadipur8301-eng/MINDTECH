<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="mt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#072414" />
      <stop offset="60%" stopColor="#0a3d1f" />
      <stop offset="100%" stopColor="#0d542b" />
    </linearGradient>
    <linearGradient id="mt-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#34d399" />
      <stop offset="50%" stopColor="#10b981" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#10b981" />
      <stop offset="100%" stopColor="#6ee7b7" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Shield Background -->
  <rect width="160" height="160" rx="36" fill="url(#mt-bg)"/>
  <rect width="154" height="154" x="3" y="3" rx="33" fill="none" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.6"/>
  
  <!-- Biotech Orbit Ring with Molecule Atoms -->
  <path d="M 45 28 C 90 10, 138 32, 144 76 C 148 106, 130 134, 102 144" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" fill="none" stroke-dasharray="8 4"/>
  <circle cx="128" cy="48" r="5" fill="#34d399"/>
  <circle cx="144" cy="76" r="6" fill="#6ee7b7"/>
  <circle cx="130" cy="106" r="5" fill="#10b981"/>

  <!-- MT Monogram Letters (Bold, Ultra-Crisp & High Contrast) -->
  <!-- 'M' Letter -->
  <path d="M 24 122 L 24 42 L 50 88 L 76 42 L 76 122" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- 'T' Letter (Overlapping with Emerald Accent) -->
  <path d="M 68 42 L 134 42" stroke="url(#mt-gold)" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M 101 42 L 101 122" stroke="url(#mt-gold)" stroke-width="13" stroke-linecap="round" fill="none"/>

  <!-- Botanical Biotech Leaf Accent at base -->
  <path d="M 64 122 C 64 122, 90 125, 114 96 C 118 90, 115 78, 104 76 C 90 74, 72 98, 64 122 Z" fill="url(#leaf-grad)"/>
  <path d="M 64 122 Q 92 98 104 76" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9"/>
</svg>
