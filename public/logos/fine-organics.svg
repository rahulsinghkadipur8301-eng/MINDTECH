<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 75" width="100%" height="100%">
  <defs>
    <linearGradient id="fo-leaf-grad1" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#005A2B" />
      <stop offset="60%" stop-color="#0A8748" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="fo-leaf-grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A783E" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="fo-sub-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Corporate Green Chemistry Leaf Emblem -->
  <g transform="translate(6, 6)">
    <!-- Outer Botanical Swoosh Wing -->
    <path 
      d="M 12 58 C 16 38, 28 18, 54 8 C 50 24, 40 40, 24 52 C 19 55, 15 57, 12 58 Z" 
      fill="url(#fo-leaf-grad1)" 
    />
    
    <!-- Inner Ascending Bio-Leaf Wing -->
    <path 
      d="M 22 54 C 29 42, 41 33, 56 26 C 46 39, 36 49, 22 54 Z" 
      fill="url(#fo-leaf-grad2)" 
    />

    <!-- Dynamic Oleochemical Seed Node -->
    <circle cx="53" cy="8" r="3" fill="#10B981" />

    <!-- Delicate Stem Accent -->
    <path 
      d="M 8 62 C 14 62, 18 59, 22 55" 
      stroke="#005A2B" 
      stroke-width="2.5" 
      stroke-linecap="round" 
      fill="none" 
    />
  </g>

  <!-- Brand Typography Block -->
  <!-- Primary Wordmark -->
  <text 
    x="74" 
    y="42" 
    font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" 
    font-size="25" 
    font-weight="900" 
    letter-spacing="1.2" 
    fill="#044E28"
  >
    FINE ORGANICS
  </text>

  <!-- Corporate Subtitle -->
  <text 
    x="75" 
    y="58" 
    font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" 
    font-size="8.5" 
    font-weight="800" 
    letter-spacing="2.4" 
    fill="#059669"
  >
    FINE ORGANIC INDUSTRIES LTD.
  </text>

  <!-- Subtle Micro Baseline Accent -->
  <line 
    x1="75" 
    y1="64" 
    x2="280" 
    y2="64" 
    stroke="url(#fo-sub-grad)" 
    stroke-width="1.2" 
    stroke-opacity="0.4"
    stroke-linecap="round"
  />
</svg>
