<svg xmlns="http://www.w3.org/2000/svg" width="280" height="200" viewBox="0 0 280 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="50%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Clean Canvas Background matching Greentech Aspect -->
  <rect width="280" height="200" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>

  <!-- Top Decorative Identity Stripe -->
  <rect x="0" y="0" width="280" height="4" fill="url(#barGrad)"/>

  <!-- Partner Badge Header -->
  <rect x="12" y="14" width="94" height="18" rx="9" fill="#ffffff" stroke="#047857" stroke-width="1"/>
  <text x="59" y="26.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" fill="#064e3b" text-anchor="middle" letter-spacing="0.5">FINE ORGANICS</text>

  <!-- Certified Grade Tag -->
  <rect x="204" y="14" width="64" height="18" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="236" y="26.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.3">100% CoA</text>

  <!-- Central Scientific Illustration -->
  <g transform="translate(0, -6)">
    <circle cx="140" cy="85" r="32" fill="#dcfce7" stroke="#047857" stroke-width="2" opacity="0.9"/>
       <path d="M140 66 C148 74 156 84 156 92 C156 100 148 104 140 104 C132 104 124 100 124 92 C124 84 132 74 140 66 Z" fill="#047857"/>
       <path d="M140 76 Q144 88 150 94" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
       <circle cx="140" cy="72" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Product Code / Name Display -->
  <text x="140" y="132" font-family="'Outfit', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="800" fill="#064e3b" text-anchor="middle" letter-spacing="0.5">FINESTER EG 1018</text>

  <!-- INCI Name Description -->
  <text x="140" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">Glycol Stearate (EGMS)</text>

  <!-- Bottom Benefit & Dosage Pill -->
  <rect x="12" y="166" width="256" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="22" y="180.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#047857">Glycol Stearate</text>
  <text x="258" y="180.5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#64748b" text-anchor="end">Dose: 1–5%</text>
</svg>