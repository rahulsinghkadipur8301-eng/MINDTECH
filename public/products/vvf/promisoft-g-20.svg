<svg xmlns="http://www.w3.org/2000/svg" width="280" height="200" viewBox="0 0 280 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="50%" stop-color="#ccfbf1"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <!-- Clean Canvas Background matching Greentech Aspect -->
  <rect width="280" height="200" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>

  <!-- Top Decorative Identity Stripe -->
  <rect x="0" y="0" width="280" height="4" fill="url(#barGrad)"/>

  <!-- Partner Badge Header -->
  <rect x="12" y="14" width="94" height="18" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1"/>
  <text x="59" y="26.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" fill="#134e4a" text-anchor="middle" letter-spacing="0.5">VVF LIMITED</text>

  <!-- Certified Grade Tag -->
  <rect x="204" y="14" width="64" height="18" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="236" y="26.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.3">100% CoA</text>

  <!-- Central Scientific Illustration -->
  <g transform="translate(0, -6)">
    <circle cx="140" cy="85" r="32" fill="#ccfbf1" stroke="#0f766e" stroke-width="2" opacity="0.9"/>
       <path d="M140 68 L154 77 L154 93 L140 102 L126 93 L126 77 Z" fill="none" stroke="#0f766e" stroke-width="2.5"/>
       <circle cx="140" cy="85" r="6" fill="#0f766e"/>
       <circle cx="140" cy="68" r="3" fill="#2dd4bf"/>
       <circle cx="154" cy="93" r="3" fill="#2dd4bf"/>
       <circle cx="126" cy="93" r="3" fill="#2dd4bf"/>
  </g>

  <!-- Product Code / Name Display -->
  <text x="140" y="132" font-family="'Outfit', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="800" fill="#134e4a" text-anchor="middle" letter-spacing="0.5">PROMISOFT G 20</text>

  <!-- INCI Name Description -->
  <text x="140" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">Octyldodecanol (Guerbet Alcohol)</text>

  <!-- Bottom Benefit & Dosage Pill -->
  <rect x="12" y="166" width="256" height="22" rx="11" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="22" y="180.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="#0f766e">Branched Emollient</text>
  <text x="258" y="180.5" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#64748b" text-anchor="end">Dose: 1–10%</text>
</svg>